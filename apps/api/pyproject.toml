[project]
name = "jobtracker-api"
version = "0.1.0"
description = "Job tracker API, worker and CLI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "httpx",
    "beautifulsoup4",
    "lxml",
    "inngest",
    "anthropic",
    "typer",
    "typst",
    "jinja2",
    "structlog",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "mypy",
    "polyfactory",
    "pytest-cov>=7.1.0",
]

[project.scripts]
jt = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "UP007", "UP035", "I001"]  # Alembic-generated

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real external services; excluded by default"]
addopts = "-m 'not live'"
